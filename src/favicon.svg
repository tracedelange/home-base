<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #f1ede3 } .ink { fill: #1d1c19 } .orbit { fill: none; stroke: #5f594e }
    @media (prefers-color-scheme: dark) { .tile { fill: #15181b } .ink { fill: #e5dfd2 } .orbit { stroke: #a39d8f } }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <circle class="orbit" cx="16" cy="16" r="10" stroke-width="1.75"/>
  <circle class="ink" cx="16" cy="16" r="3.5"/>
  <!-- planet at 45° on the orbit, with a tile-coloured gap so it sits on top of the ring -->
  <circle class="tile" cx="23.07" cy="8.93" r="4.6"/>
  <circle class="ink" cx="23.07" cy="8.93" r="3"/>
</svg>
